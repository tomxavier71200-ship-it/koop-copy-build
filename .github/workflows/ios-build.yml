name: KOOP COPY Sideload Build

on:
  workflow_dispatch:
  push:
    branches: ['main']

permissions:
  # write: the job publishes the .ipa and the SideStore source to the
  # rolling `koop-ios` release so SideStore can offer one-tap updates.
  contents: write

concurrency:
  group: koop-copy-ios
  cancel-in-progress: false

jobs:
  ios:
    # macos-latest is ARM64 and has repeatedly failed to acquire a hosted
    # runner. GitHub documents macos-15-intel as the supported Intel pool.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Configure separate KOOP COPY identity
        run: |
          cat > ios/Config/Signing.xcconfig <<'EOF'
          APP_BUNDLE_IDENTIFIER = wtf.openstrap.koopcopy
          APP_WIDGET_BUNDLE_IDENTIFIER = wtf.openstrap.koopcopy.OpenStrapWidget
          APP_GROUP_IDENTIFIER = group.wtf.openstrap.koopcopy
          EOF
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName KOOP COPY' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName KOOP COPY' ios/Runner/Info.plist

      - name: Write blank .env
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env

      - name: Install flutterfire (required by Crashlytics Xcode build phase)
        run: dart pub global activate flutterfire_cli 1.4.0

      - name: Install dependencies
        run: flutter pub get --verbose

      # The sideloaded IPA cannot keep a Watch companion: a free Apple ID
      # cannot re-sign it. Remove the target before Xcode validates signing,
      # instead of deleting its output only after the build.
      - name: Exclude Watch companion from sideload build
        run: |
          gem install xcodeproj
          ruby .github/scripts/remove_watch_target.rb

      - name: Build unsigned iOS app
        # A version that rises on every run (0.10.<run>), so SideStore sees each
        # push as an update; the pubspec version stays the release line.
        run: >
          flutter build ios --release --no-codesign --dart-define-from-file=.env
          --build-name=0.10.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --verbose

      # The home-screen widget ships. It used to be stripped: --no-codesign
      # leaves the .appex with no signature at all, SideStore failed with
      # "No code signature found", and with no entitlements in the binaries it
      # could not have known the app and widget share an App Group anyway.
      # ldid gives both a placeholder signature CARRYING the App Group
      # entitlement; SideStore reads it, registers the group under the
      # person's own team (renamed, recorded as ALTAppGroups — which
      # AppGroup.swift / AppGroupResolver read) and re-signs everything.
      # Only the widget extension is kept: every extension costs one of a
      # free Apple ID's three App IDs (SideStore, Koop, widget).
      - name: Sign the app and widget with their App Group
        run: |
          set -euo pipefail
          brew install ldid
          app=build/ios/iphoneos/Runner.app
          # Verify app exists
          if [ ! -d "$app" ]; then
            echo "ERROR: App not found at $app"
            ls -la build/ios/iphoneos/
            exit 1
          fi
          # Keep only the widget extension
          find "$app/PlugIns" -mindepth 1 -maxdepth 1 ! -name 'OpenStrapWidgetExtension.appex' -exec rm -rf {} +
          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.wtf.openstrap.koopcopy</string></array>
          </dict></plist>
          EOF
          appex="$app/PlugIns/OpenStrapWidgetExtension.appex"
          if [ -d "$appex" ]; then
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")
            ldid -Sent.plist "$appex/$executable"
          else
            echo "::warning::widget extension not found in the build"
          fi
          # The app also carries HealthKit (Runner.entitlements has it; a
          # --no-codesign build drops it): without it iOS refuses every Apple
          # Health read and write ("Apple Health did not grant ..."). The
          # widget gets only the App Group.
          cp ent.plist app-ent.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.healthkit bool true" \
            -c "Add :com.apple.developer.healthkit.access array" app-ent.plist
          ldid -Sapp-ent.plist "$app/Runner"
          ldid -e "$app/Runner"
          echo "Signing complete"

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr -y "$GITHUB_WORKSPACE/koop-copy-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: koop-copy-ipa
          path: koop-copy-unsigned.ipa
          retention-days: 14


      - name: Publish IPA and SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="koop-copy-ios"
          ipa="koop-copy-${{ github.run_number }}-${{ github.run_attempt }}.ipa"
          cp koop-copy-unsigned.ipa "$ipa"
          python3 .github/scripts/gen_koop_source.py "$ipa" apps.json "$GITHUB_REPOSITORY" "$tag"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "KOOP COPY SideStore" --notes "Separate KOOP COPY sideload builds" --prerelease
          gh release upload "$tag" "$ipa" --repo "$GITHUB_REPOSITORY"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan sidestore-publish
          git rm -rf --cached . >/dev/null
          git add -f apps.json
          git commit -m "Publish KOOP COPY build ${{ github.run_number }}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" push origin HEAD:sidestore --force
